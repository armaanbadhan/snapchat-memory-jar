name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: "Snapchat Memory Jar"
  DEFAULT_VERSION: "1.0.0"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Version String
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ env.DEFAULT_VERSION }}" >> $GITHUB_ENV
          fi

      - name: Build Application with xcodebuild
        run: |
          xcodebuild -project "${{ env.APP_NAME }}.xcodeproj" \
                     -scheme "${{ env.APP_NAME }}" \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      - name: Install create-dmg
        run: brew install create-dmg
             
      - name: Create DMG
        run: |
          # Automatically find where xcodebuild dropped the .app bundle inside the build folder
          DETECTED_APP_PATH=$(find build -name "${{ env.APP_NAME }}.app" | head -n 1)

          xattr -cr "$DETECTED_APP_PATH"
          
          create-dmg \
            --volname "${{ env.APP_NAME }} Installer" \
            --window-pos 200 120 \
            --window-size 800 500 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 200 250 \
            --app-drop-link 600 250 \
            "${{ env.APP_NAME }}-${{ env.VERSION }}.dmg" \
            "$DETECTED_APP_PATH"

      - name: Native GitHub Release Creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_FILE="${{ env.APP_NAME }}-${{ env.VERSION }}.dmg"
          
          # Check if the release already exists
          if gh release view "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Release ${{ env.VERSION }} already exists. Uploading asset..."
            # Uploads and overwrites the DMG file if it's already there
            gh release upload "${{ env.VERSION }}" "$DMG_FILE" --clobber
          else
            echo "Creating a new release for ${{ env.VERSION }}..."
            # Natively creates the release and attaches the file
            gh release create "${{ env.VERSION }}" "$DMG_FILE" \
              --title "Release ${{ env.VERSION }}" \
              --notes "Automated build of ${{ env.APP_NAME }}"
          fi
